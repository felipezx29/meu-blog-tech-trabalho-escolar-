        <header><h1 id="tituloprinc">Meu blog tech</h1>

            <nav>
               <p>vou compartilhar conteudo sobre tecnologia e programação</p>

        </header>

        <main>

            <section class="container">
                <article class="AC1">
                    <img src="img/images.jpeg"  width="100px" height="100px" alt="img1">
                    <div>
                        <h2>Meu primeiro post</h2>
                        <p> Aqui compartilharei conteúdo e curiosidades sobre tecnologia!</p>
                        <button  class="bt1">👍 <span>0</span> </button>

                </article>
                <article class="AC2">

    </body>
    <script>

            const botoes = document.querySelectorAll("button");
            botoes.forEach(function(botao) {
                let curtiu = false;
            botao.addEventListener("click", botaoClicado);
        

            function botaoClicado() {
                console.log("tomei no butao");
                let texto = botao.querySelector("span");
                if (curtiu === false){
                texto.textContent++; 
                curtiu = true;  
                }
                else{
                    texto.textContent--;
                    curtiu = false;
                }
                
            }});





    </script>
